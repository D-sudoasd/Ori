<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" role="img" aria-label="Import two-column spectra, select XYYY or XYXY per group, export Origin or Excel and CSV">
  <rect width="1200" height="220" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#e2e8f0">
    <rect x="40" y="50" width="230" height="120" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="155" y="105" text-anchor="middle" font-size="22" font-weight="700">Drop folder</text>
    <text x="155" y="135" text-anchor="middle" font-size="16" fill="#94a3b8">TXT / DAT / XY / CSV / TSV</text>
    <polygon points="290,110 320,110 320,100 355,120 320,140 320,130 290,130" fill="#38bdf8"/>
    <rect x="375" y="50" width="230" height="120" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="490" y="105" text-anchor="middle" font-size="22" font-weight="700">XYYY / XYXY</text>
    <text x="490" y="135" text-anchor="middle" font-size="16" fill="#94a3b8">auto layout for each group</text>
    <polygon points="625,110 655,110 655,100 690,120 655,140 655,130 625,130" fill="#34d399"/>
    <rect x="710" y="50" width="230" height="120" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="825" y="105" text-anchor="middle" font-size="22" font-weight="700">Sheet groups</text>
    <text x="825" y="135" text-anchor="middle" font-size="16" fill="#94a3b8">filename or manual groups</text>
    <polygon points="960,110 990,110 990,100 1025,120 990,140 990,130 960,130" fill="#fbbf24"/>
    <rect x="1045" y="50" width="115" height="120" rx="14" fill="#38bdf8"/>
    <text x="1102" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">.opju</text>
    <text x="1102" y="135" text-anchor="middle" font-size="14" fill="#0f172a">.xlsx / .csv</text>
  </g>
</svg>
